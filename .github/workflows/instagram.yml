name: GitFinds Instagram posting

on:
  schedule:
    - cron: "55 2-17 * * *"  # every hour at :25 IST, 8:25 AM - 11:25 PM IST (GitHub may start a few min late)
    - cron: "35 11 * * *"   # backup run 5:05 PM IST
    - cron: "10 12 * * *"   # backup run 5:40 PM IST
  push:                      # a commit to .github/retry/instagram.txt re-runs it (safe: never posts twice)
    branches: [main]
    paths: [".github/retry/instagram.txt"]
  workflow_dispatch:         # "Run workflow" button for manual runs
    inputs:
      mode:
        description: "normal = only near posting time, post-now = post the next video immediately, dry-run = just check, post nothing"
        type: choice
        options: [dry-run, rehearsal, normal, post-now, test-alert, renew-ig-key]
        default: dry-run

concurrency:
  group: gitfinds-instagram   # never two runs at once (prevents double posts)
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # for the keep-alive step below
  issues: write    # to open an alert issue (GitHub emails you) when a run fails

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post Instagram video
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SHEETS_REFRESH_TOKEN: ${{ secrets.SHEETS_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_POST_TIME: ${{ vars.IG_POST_TIME }}
          PAUSED: ${{ vars.PAUSED }}
          POST_EVERY_DAYS: ${{ vars.POST_EVERY_DAYS }}
          IG_PAUSED: ${{ vars.IG_PAUSED }}
          IG_FOLLOW_YOUTUBE: ${{ vars.IG_FOLLOW_YOUTUBE }}
        run: python autopost.py --platform instagram --mode "${{ inputs.mode || 'normal' }}"
      - name: Keep the daily schedule alive
        # GitHub turns off scheduled workflows after 60 days without repo activity.
        # Re-enabling it on the 1st and 15th of each month resets that timer.
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(TZ=Asia/Kolkata date +%d); h=$(TZ=Asia/Kolkata date +%H)
          if { [ "$d" = "01" ] || [ "$d" = "15" ]; } && [ "$h" = "08" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/instagram.yml/enable" && echo "Schedule kept alive"
          fi
      - name: Alert me if something went wrong
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ Instagram posting failed - $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')"
          body="The Instagram automation failed. Open the run to see why: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body" --assignee "${{ github.repository_owner }}" \
            || gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
