name: GitFinds daily posting

# One video every day, live on YouTube AND Instagram at the same minute (POST_TIME, default 7:00 PM IST).
# Preparation starts up to 60 min before. Every run is safe: a video is never posted twice.
on:
  schedule:                  # GitHub often skips these, so there are several (the Apps Script helper also starts it at 6:05 / 6:35 PM)
    - cron: "45 12 * * *"    # 6:15 PM IST
    - cron: "55 12 * * *"    # 6:25 PM IST
    - cron: "5 13 * * *"     # 6:35 PM IST
    - cron: "20 13 * * *"    # 6:50 PM IST
    - cron: "45 13 * * *"    # 7:15 PM IST (retry)
    - cron: "30 14 * * *"    # 8:00 PM IST (retry)
    - cron: "0 16 * * *"     # 9:30 PM IST (last retry)
  push:                      # a commit to .github/retry/post.txt re-runs it (safe: never posts twice)
    branches: [main]
    paths: [".github/retry/post.txt"]
  workflow_dispatch:         # "Run workflow" button / started by the Apps Script helper
    inputs:
      mode:
        description: "normal = post today's video at the posting time, dry-run = only check (posts nothing), post-now = post the next video immediately, test-email = send a test email, full-test = demo video: private YouTube upload + unpublished Instagram upload"
        type: choice
        options: [normal, dry-run, full-test, post-now, test-email, renew-ig-key]
        default: normal

concurrency:
  group: gitfinds-posting   # never two runs at once (prevents double posts)
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # keep-alive step
  issues: write    # fallback alert when email isn't set up

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post today's video on YouTube + Instagram
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SHEETS_REFRESH_TOKEN: ${{ secrets.SHEETS_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          EMAIL_HOOK_URL: ${{ secrets.EMAIL_HOOK_URL }}
          EMAIL_HOOK_SECRET: ${{ secrets.EMAIL_HOOK_SECRET }}
          POST_TIME: ${{ vars.POST_TIME }}
          POST_EVERY_DAYS: ${{ vars.POST_EVERY_DAYS }}
          PAUSED: ${{ vars.PAUSED }}
          YT_PAUSED: ${{ vars.YT_PAUSED }}
          IG_PAUSED: ${{ vars.IG_PAUSED }}
          GH_TOKEN: ${{ github.token }}
        run: python autopost.py --platform daily --mode "${{ inputs.mode || 'normal' }}"
      - name: Refresh channel numbers for the dashboard
        if: always()
        continue-on-error: true
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SHEETS_REFRESH_TOKEN: ${{ secrets.SHEETS_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_COMMENTS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_COMMENTS_REFRESH_TOKEN }}
          YOUTUBE_COMMENTS_CLIENT_ID: ${{ secrets.YOUTUBE_COMMENTS_CLIENT_ID }}
          YOUTUBE_COMMENTS_CLIENT_SECRET: ${{ secrets.YOUTUBE_COMMENTS_CLIENT_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python stats.py
      - name: Keep the daily schedule alive
        # GitHub turns off scheduled workflows after 60 days without repo activity.
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(TZ=Asia/Kolkata date +%d); h=$(TZ=Asia/Kolkata date +%H)
          if { [ "$d" = "01" ] || [ "$d" = "15" ]; } && [ "$h" = "18" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/post.yml/enable" && echo "Schedule kept alive"
          fi
