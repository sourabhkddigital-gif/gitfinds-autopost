name: GitFinds channel stats

# Views, likes, comments and followers for YouTube + Instagram, written to the posting sheet
# ("Channel stats" and "Video stats" tabs) so the GitFinds dashboard can show them.
on:
  schedule:
    - cron: "17 * * * *"     # every hour (GitHub may run it late; the dashboard shows the time)
  workflow_dispatch:

concurrency:
  group: gitfinds-stats
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Read channel numbers and save them to the sheet
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SHEETS_REFRESH_TOKEN: ${{ secrets.SHEETS_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_COMMENTS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_COMMENTS_REFRESH_TOKEN }}
          YOUTUBE_COMMENTS_CLIENT_ID: ${{ secrets.YOUTUBE_COMMENTS_CLIENT_ID }}
          YOUTUBE_COMMENTS_CLIENT_SECRET: ${{ secrets.YOUTUBE_COMMENTS_CLIENT_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python stats.py
